coug_waypoints:
  agent_list:
    type: string_array
    default_value: []
  default_speed_rpm:
    type: double
    default_value: 1500.0
    validation:
      gt_eq<>: [0.0]
  default_capture_radius:
    type: double
    default_value: 25.0
    validation:
      gt_eq<>: [0.0]
  default_capture_radius_z:
    type: double
    default_value: 2.0
    validation:
      gt_eq<>: [0.0]
  default_slip_radius:
    type: double
    default_value: 50.0
    validation:
      gt_eq<>: [0.0]
  default_slip_radius_z:
    type: double
    default_value: 4.0
    validation:
      gt_eq<>: [0.0]
  default_search_radii:
    type: double_array
    default_value: [9.0, 15.588]
    validation:
      not_empty<>: []
      lower_element_bounds<>: [0.0]
  default_search_points:
    type: int
    default_value: 6
    validation:
      gt_eq<>: [3]
  waypoint_topic:
    type: string
    default_value: "waypoints"
    validation:
      not_empty<>: []
  waypoint_nav2_topic:
    type: string
    default_value: "waypoints_nav2"
    validation:
      not_empty<>: []
  start_service:
    type: string
    default_value: "base/start"
    validation:
      not_empty<>: []
  stop_service:
    type: string
    default_value: "base/stop"
    validation:
      not_empty<>: []
  surface_service:
    type: string
    default_value: "base/surface"
    validation:
      not_empty<>: []
  home_service:
    type: string
    default_value: "base/home"
    validation:
      not_empty<>: []
  map_frame:
    type: string
    default_value: "map"
    validation:
      not_empty<>: []
